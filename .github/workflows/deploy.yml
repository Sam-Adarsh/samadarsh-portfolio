name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portfolio/package-lock.json

      # Build Haugtun (root project)
      - name: Install root dependencies
        run: npm ci

      - name: Build Haugtun
        run: npm run build

      # Build the portfolio
      - name: Install portfolio dependencies
        run: npm ci
        working-directory: ./portfolio

      - name: Build portfolio
        run: npm run build
        working-directory: ./portfolio

      # Merge portfolio build into dist as the root site
      - name: Merge portfolio into dist root
        run: cp -R portfolio/dist/. dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
