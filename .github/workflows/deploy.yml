name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      # Build the old portfolio (root project)
      - name: Install root dependencies
        run: npm ci

      - name: Build old portfolio
        run: npm run build

      # Tuck the old portfolio under /legacy so the new one can take the root
      - name: Move old portfolio to /legacy
        run: |
          mkdir -p dist/legacy
          mv dist/index.html dist/legacy/

      # Build the new portfolio (demo project)
      - name: Install new portfolio dependencies
        run: npm ci
        working-directory: ./demo

      - name: Build new portfolio
        run: npm run build
        working-directory: ./demo

      # Merge new portfolio's build into dist as the new root
      - name: Merge new portfolio into dist root
        run: cp -R demo/dist/. dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
